name: CodeQL Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday at 03:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: csharp
          # Exclude generated/build artifact files from analysis
          config: |
            queries:
              - uses: security-extended
            paths-ignore:
              - WineApp/src/WineApp/.docker-assets
              - WineApp/src/WineApp/bin
              - WineApp/src/WineApp/obj
              - WineApp/src/WineApp/wwwroot/js
              - '**/*.min.js'

      - name: Build
        working-directory: WineApp
        run: dotnet build src/WineApp/WineApp.csproj --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: '/language:csharp'
